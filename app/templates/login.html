{% extends "base.html" %}

{% block title %}Вход в систему{% endblock %}
{% block page_title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h4 class="text-center mb-4">Вход в систему</h4>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">Имя пользователя</label>
                        <input
                            type="text"
                            class="form-control"
                            id="loginUsername"
                            name="username"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="loginPassword"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="loginSubmit">Войти</button>
                </form>
                <div id="loginError" class="alert alert-danger mt-3 d-none" role="alert" aria-live="polite"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const usernameField = document.getElementById('loginUsername');
        const passwordField = document.getElementById('loginPassword');
        const submitButton = document.getElementById('loginSubmit');
        const errorBox = document.getElementById('loginError');

        const username = usernameField.value;
        const password = passwordField.value;

        errorBox.classList.add('d-none');
        submitButton.disabled = true;

        try {
            const result = await login(username, password);
            if (result.success) {
                window.location.href = '/';
                return;
            }
            errorBox.textContent = result.error;
            errorBox.classList.remove('d-none');
        } catch (error) {
            errorBox.textContent = 'Не удалось выполнить вход. Проверьте соединение и попробуйте снова.';
            errorBox.classList.remove('d-none');
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
{% endblock %}
