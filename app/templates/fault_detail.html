{% block scripts %}
<script>
const faultId = {{ fault_id }};

async function loadFaultDetail() {
    try {
        // Загружаем данные параллельно
        const [fault, projects] = await Promise.all([
            API.getFault(faultId),
            API.getProjects()
        ]);

        renderFault(fault, projects);
        loadComments(); // Оставляем вызов для загрузки комментариев
    } catch (error) {
        document.getElementById('faultTitle').textContent = 'Ошибка загрузки';
    }
}

function renderFault(fault, allProjects) {
    document.getElementById('faultTitle').textContent = fault.title;
    // ... (остальная логика рендеринга полей) ...
}

async function updateStatus(status) {
    try {
        await API.updateFault(faultId, { status });
        loadFaultDetail();
        alert('Статус обновлён!');
    } catch (e) { alert('Ошибка обновления'); }
}

async function deleteFault() {
    if (!confirm('Удалить неисправность?')) return;
    try {
        await API.deleteFault(faultId);
        window.location.href = '/faults';
    } catch (e) { alert('Ошибка удаления'); }
}

// Инициализация
document.addEventListener('DOMContentLoaded', loadFaultDetail);
</script>
{% endblock %}
