[project]
name = "faults"
version = "0.1.0"
description = "Add your description here"
readme = "Readme.md"
requires-python = ">=3.8.10, <3.9"
authors = [
    {name = "sanja_s", email = "sanja100v@gmail.com"}
]

dependencies = [
    "aiofiles>=24.1.0",
    "apscheduler>=3.11.2",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.124.4",
    "jinja2==3.1.6",
    "passlib>=1.7.4",
    "pydantic==2.10.6",
    "pydantic-settings>=2.8.1",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.20",
    "pytz>=2026.2",
    "reportlab==3.6.12",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.33.0",
]

[project.urls]
Repository = "https://github.com/sanjas12/39_Faults.git"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
build = []

dev = [
    "commitizen==3.31.0",
    "httpx>=0.28.1",
    "mypy==1.14.1",
    "pre-commit==2.21.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
]

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    # "sys_platform == 'linux'",  # раскоментить если будет в linux собираться
]

[tool.setuptools]
packages = ["app"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "_version.py:__version__",
]
tag_format = "$version"
update_changelog_on_bump = true
changelog_file = "docs/CHANGELOG.md"

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

# В этих legacy-модулях используется старый декларативный стиль SQLAlchemy.
# Исключения перечислены явно, чтобы mypy проверял весь остальной пакет app и
# baseline можно было сокращать по мере перехода моделей на Mapped[].
[[tool.mypy.overrides]]
module = [
    "app.main",
    "app.api.attachments",
    "app.api.auth",
    "app.api.backup",
    "app.api.dashboard",
    "app.api.export",
    "app.api.faults",
    "app.api.knowledge_base",
    "app.api.projects",
    "app.core.security",
    "app.models.all_models",
    "app.services.pdf_service",
]
ignore_errors = true

# ─── Ruff: линтер + форматер ─────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "N",
    "SIM",
]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
