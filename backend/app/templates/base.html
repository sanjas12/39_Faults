<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faults - {% block title %}Система контроля неисправностей{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar" style="min-height: 100vh; padding-top: 20px;">
                <div class="position-sticky">
                    <h3 class="text-white text-center mb-4">
                        <i class="bi bi-gear"></i> Faults
                    </h3>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white {% if active_page == 'dashboard' %}active bg-primary{% endif %}" href="/">
                                <i class="bi bi-speedometer2"></i> Дашборд
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white {% if active_page == 'projects' %}active bg-primary{% endif %}" href="/projects">
                                <i class="bi bi-folder"></i> Проекты
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white {% if active_page == 'faults' %}active bg-primary{% endif %}" href="/faults">
                                <i class="bi bi-bug"></i> Неисправности
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white {% if active_page == 'knowledge' %}active bg-primary{% endif %}" href="/knowledge">
                                <i class="bi bi-book"></i> База знаний
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" style="padding-top: 20px;">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">{% block page_title %}Дашборд{% endblock %}</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.location.reload()">
                                <i class="bi bi-arrow-clockwise"></i> Обновить
                            </button>
                        </div>
                    </div>
                </div>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
